<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sk shop</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    header {
        background: #111;
        color: white;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    nav a {
        color: white;
        margin-left: 20px;
        text-decoration: none;
    }

    .container {
        padding: 30px;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
    }

    .card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
    }

    .card-content {
        padding: 15px;
        text-align: center;
    }

    .price {
        color: #27ae60;
        font-weight: bold;
    }

    button {
        margin-top: 10px;
        background: #111;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
    }

    footer {
        text-align: center;
        padding: 20px;
        background: #111;
        color: white;
        margin-top: 30px;
    }
</style>
</head>
<body>

<header>
    <h1>mobile app</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart</a>
    </nav>
</header>

<div class="container">
    <h2>Our Products</h2>

    <div class="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f" alt="T-Shirt">
            <div class="card-content">
                <h3>Casual T-Shirt</h3>
                <p class="price">$19.99</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" alt="Camera">
            <div class="card-content">
                <h3>Camera</h3>
                <p class="price">$299.99</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552" alt="Shoes">
            <div class="card-content">
                <h3>Candid Photos</h3>
                <p class="price">$59.99</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d" alt="Watch">
            <div class="card-content">
                <h3>Running Shoes</h3>
                <p class="price">$89.99</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 SimpleShop. All rights reserved.</p>
</footer>

</body>
</html>
